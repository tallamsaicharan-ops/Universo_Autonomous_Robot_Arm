# 3-DOF arm: only the tip POSITION can be reached, not a full 6-D pose.
# position_only_ik makes KDL ignore orientation (otherwise IK fails for almost every goal).
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
